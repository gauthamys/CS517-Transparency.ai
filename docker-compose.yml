version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      # Point to the host's Ollama service
      OLLAMA_URL: http://host.docker.internal:11434
    # Map host.docker.internal to the host gateway so the container can reach host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: flask run --host=0.0.0.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command: npm start
    depends_on:
      - backend

networks:
  default:
    driver: bridge
